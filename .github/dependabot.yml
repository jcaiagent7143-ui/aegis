version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      llm-sdks:
        patterns:
          - "anthropic"
          - "openai"
          - "google-genai"
          - "ollama"
          - "litellm"
      dev-deps:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "vcrpy"
          - "respx"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
