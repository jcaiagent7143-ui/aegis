name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Include proxy + mcp + openai extras: tests/unit/test_proxy_app.py
          # imports fastapi.testclient; test_mcp_server imports mcp; the
          # provider tests import the openai SDK shape (even via Mock).
          pip install -e ".[dev,proxy,mcp,openai]"
      - name: Unit tests
        run: pytest tests/unit -v --cov=aegis --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: false
