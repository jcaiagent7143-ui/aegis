name: release

# Triggered on a version tag (e.g. v0.4.0) — builds + publishes to PyPI.
#
# Uses PyPI Trusted Publishing (OIDC) so no API token is stored in GitHub secrets.
# One-time setup at https://pypi.org/manage/account/publishing/:
#   * PyPI project name: self-harness
#   * Owner:              jcaiagent7143-ui
#   * Repository name:    aegis
#   * Workflow name:      release.yml
#   * Environment name:   pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/self-harness/
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Extract the section for this version from CHANGELOG.md
          awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${tag}" > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
