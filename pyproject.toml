[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aegis-harness"
version = "0.4.0"
description = "Dynamic, on-the-fly generated harnesses for AI agents — the LLM writes the entire runtime (system prompt, loop, tools, schema, verifier) per task."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "The Aegis Contributors" },
]
keywords = [
  "ai", "agent", "llm", "claude", "openai", "guardrails",
  "safety", "harness", "agi", "dynamic-harness", "self-harness",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "jinja2>=3.1",
  "rich>=13.7",
  "typer>=0.12",
  "anyio>=4.3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.104.0"]
openai = ["openai>=2.38.0"]
gemini = ["google-genai>=2.6.0"]
ollama = ["ollama>=0.6.2"]
litellm = ["litellm>=1.85.1"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
proxy = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
mcp = ["mcp>=1.0"]
tui = ["textual>=0.60"]
embeddings = ["numpy>=1.26"]
all = [
  "anthropic>=0.104.0",
  "openai>=2.38.0",
  "google-genai>=2.6.0",
  "ollama>=0.6.2",
  "litellm>=1.85.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "mcp>=1.0",
  "textual>=0.60",
  "numpy>=1.26",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "vcrpy>=6.0",
  "respx>=0.21",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/loongnianchew/aegis"
Documentation = "https://loongnianchew.github.io/aegis"
Repository = "https://github.com/loongnianchew/aegis"
Issues = "https://github.com/loongnianchew/aegis/issues"

[project.scripts]
aegis = "aegis.cli.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.hatch.build.targets.sdist]
include = [
  "src/aegis",
  "README.md",
  "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "F", "W",     # pycodestyle, pyflakes
  "I",                # isort
  "B",                # bugbear
  "UP",               # pyupgrade
  "SIM",              # simplify
  "RUF",              # ruff-specific
]
ignore = ["E501"]    # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"examples/**" = ["E402"]
# Typer requires `typer.Option(...)` in default values — that's the API.
"src/aegis/cli/**" = ["B008"]
# StrEnum is Python 3.11+; we already require it, but the inheritance pattern
# is explicit and clearer for non-3.11 readers.
"src/aegis/core/risk.py" = ["UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["aegis"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "google.*", "ollama.*", "litellm.*", "vcr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "live: tests that hit real LLM APIs (require RUN_LIVE_TESTS=1)",
  "integration: tests using recorded LLM cassettes",
]

[tool.coverage.run]
source = ["src/aegis"]
omit = ["src/aegis/web/*", "src/aegis/cli/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
